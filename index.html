<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniels Burger · Ordering demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="images.js"></script>
<style>
:root{
  --gold:#F5A623; --gold2:#FFC75A; --neon:#FF7A1A; --red:#C8321F; --blk:#14100D; --wood:#2B1D14; --wood2:#3A281C;
  --cream:#FBF3E6; --line:#EADBC4; --mute:#7C6A58; --ok:#1E9E57;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0f0b08;color:var(--blk);font-family:'Rubik',system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--blk);background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.h{font-family:'Alfa Slab One',Georgia,serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;font-weight:400}

/* demo bar (pitch controls, not part of the app) */
.demobar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;
  padding:8px 12px;background:#2a2a2a;color:#ccc;font-size:12px}
.demobar b{color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chips button{padding:5px 10px;border-radius:999px;background:#444;color:#ddd;font-weight:700;font-size:12px}
.chips button.on{background:var(--gold);color:var(--blk)}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;margin-left:4px;padding:0 4px}

/* ===== customer app ===== */
body.cust-on{background:#0f0b08}
#customer{max-width:480px;margin:0 auto;min-height:100vh;background:#120d0a;color:#f4e9d8;padding-bottom:120px;position:relative;overflow:hidden;
  background-image:radial-gradient(90% 40% at 50% 0%,rgba(255,122,26,.22),transparent 70%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 9px)}
.c-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:#e9d9c1;letter-spacing:.02em}
.status i{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84}
.status i.off{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.lang{display:flex;border:1px solid rgba(245,166,35,.35);border-radius:999px;padding:2px;font-size:11px;font-weight:800}
.lang button{padding:5px 9px;border-radius:999px;color:#c9b597}
.lang button.on{background:var(--gold);color:var(--blk)}

.hero{text-align:center;padding:18px 20px 8px;position:relative}
.hero .logo{width:132px;height:132px;border-radius:50%;margin:0 auto;display:block;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(245,166,35,.8),0 0 26px rgba(255,122,26,.45)}50%{box-shadow:0 0 0 2px rgba(245,166,35,1),0 0 44px rgba(255,122,26,.75)}}
.hero h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;text-transform:uppercase;font-size:34px;line-height:1;margin-top:20px;color:#fbf3e6;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--gold);text-shadow:0 0 18px rgba(255,122,26,.55)}
.hero p{margin-top:10px;color:#bfa98c;font-size:14px}
.stars{color:var(--gold);letter-spacing:5px;font-size:11px;margin-top:10px}

.sig{margin:22px 16px 6px;border-radius:22px;padding:18px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#2a1b11 0%,#1a120c 60%);border:1px solid rgba(245,166,35,.45)}
.sig:before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.35),transparent 70%)}
.sig small{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--blk);background:var(--gold);padding:4px 9px;border-radius:6px}
.sig .nm{font-family:'Alfa Slab One',Georgia,serif;font-size:28px;text-transform:uppercase;margin-top:12px;color:#fff;position:relative}
.sig .d{color:#c7b294;font-size:13px;margin-top:8px;line-height:1.45;position:relative}
.sig .row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;position:relative}
.sig .pr{font-family:'Alfa Slab One',Georgia,serif;font-size:24px;color:var(--gold)}
.sig .go{background:var(--neon);color:#1a0f08;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 0 22px rgba(255,122,26,.45)}

.tabs{position:sticky;top:0;z-index:15;display:flex;gap:6px;padding:14px 16px 10px;background:linear-gradient(#120d0a 75%,rgba(18,13,10,0))}
.tabs button{flex:1;padding:11px 8px;border-radius:12px;font-weight:800;font-size:14px;color:#bda98d;background:#1d1510;border:1px solid #2e2219}
.tabs button span{font-size:11px;color:#7d6a55;margin-left:4px}
.tabs button.on{background:var(--gold);color:var(--blk);border-color:var(--gold)}
.tabs button.on span{color:#5a3b0c}
.note{padding:0 18px 8px;color:#9c8770;font-size:12.5px;display:flex;align-items:center;gap:8px}
.note b{color:var(--gold)}

.menu{padding:0 16px}
.dish{width:100%;text-align:left;display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:start;padding:16px 0;border-bottom:1px dashed #33261c}
.dish .no{font-family:'Alfa Slab One',Georgia,serif;color:#5c4632;font-size:15px;padding-top:3px}
.dish .nm{font-family:'Alfa Slab One',Georgia,serif;font-size:19px;text-transform:uppercase;color:#fbf3e6;letter-spacing:.01em}
.dish .tag{display:inline-block;font-family:Rubik;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--blk);background:#7fd1a1;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:3px}
.dish .tag.k{background:#8fc3ff}
.dish .d{grid-column:2;color:#a8927a;font-size:12.5px;line-height:1.45}
.dish .side{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.dish .pr{font-weight:800;color:var(--gold);font-size:15px;white-space:nowrap}
.dish .plus{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--neon);color:var(--neon);font-size:22px;font-weight:700;display:grid;place-items:center;line-height:1}
.dish .inc{background:var(--neon);color:#1a0f08;font-size:13px;font-weight:800}
.dish.out{opacity:.4;pointer-events:none}
.dish.out .pr{color:#7d6a55}

.info{margin:26px 16px 0;padding:16px;border-radius:18px;background:#1a130e;border:1px solid #2e2219;font-size:13px;color:#bba68a;display:grid;gap:10px}
.info div{display:flex;gap:10px;align-items:center}
.info svg{flex:none}
.info a{color:var(--gold);text-decoration:none;font-weight:700}

.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(448px,calc(100% - 28px));z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:16px 18px;border-radius:18px;background:var(--neon);color:#1a0f08;font-weight:800;font-size:16px;box-shadow:0 0 30px rgba(255,122,26,.5),0 8px 0 rgba(0,0,0,.35)}
.cartbar .cnt{background:#1a0f08;color:var(--gold2);border-radius:8px;padding:1px 8px;margin-right:8px}
.hidden{display:none!important}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,3,2,.72);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{width:min(480px,100%);max-height:90vh;overflow:auto;background:#1a130e;color:#f4e9d8;border-radius:24px 24px 0 0;padding:22px 18px 24px;border-top:1px solid rgba(245,166,35,.4);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:#3a2c22;margin:-8px auto 14px}
.sheet .h{font-size:26px;color:#fff}
.sheet .en{color:#ad977d;margin:8px 0 4px;font-size:13.5px;line-height:1.45}
.sheet .base{color:var(--gold);font-weight:800;margin-top:6px}
.lbl{font-size:11px;font-weight:800;color:#8d785f;text-transform:uppercase;letter-spacing:.14em;margin:18px 0 9px}
.adds{display:flex;flex-wrap:wrap;gap:7px}
.add{padding:9px 12px;border-radius:999px;border:1px solid #3a2c22;background:#221912;font-size:13px;font-weight:700;color:#dccab0}
.add span{color:var(--gold);margin-left:4px;font-weight:800}
.add.on{background:var(--gold);color:var(--blk);border-color:var(--gold)} .add.on span{color:var(--blk)}
.sheet input,.sheet select{background:#120d0a;border:1px solid #3a2c22;color:#f4e9d8;border-radius:12px;padding:13px;width:100%}
.sheet input:focus,.sheet select:focus{border-color:var(--gold)}
.sheet input::placeholder{color:#6d5b48}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:44px;height:44px;border-radius:12px;background:#221912;border:1px solid #3a2c22;font-size:22px;font-weight:800;color:var(--gold)}
.qty b{min-width:20px;text-align:center;font-size:20px}
.cta{width:100%;margin-top:20px;padding:16px 18px;border-radius:16px;background:var(--neon);color:#1a0f08;font-weight:800;font-size:16px;display:flex;justify-content:space-between;box-shadow:0 0 24px rgba(255,122,26,.35)}
.ghost{width:100%;margin-top:8px;padding:13px;border-radius:16px;border:1px solid #3a2c22;font-weight:800;color:#bda98d}
.line{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px dashed #33261c}
.line .x{color:#9c8770;font-size:12.5px;margin-top:2px}
.rm{color:var(--neon);font-size:12px;font-weight:800;margin-top:5px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:14px} .tot span:last-child{color:var(--gold)}
.pickup{margin-top:16px;border:1px solid rgba(245,166,35,.35);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:#120d0a}
.pickup small{color:var(--gold);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:block}
.pickup b{font-size:14.5px}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay-o{padding:12px;border-radius:14px;border:1px solid #3a2c22;background:#221912;text-align:left}
.pay-o b{display:block;font-size:14px} .pay-o span{font-size:12px;color:#9c8770;font-weight:700}
.pay-o.on{border-color:var(--gold);background:rgba(245,166,35,.12)} .pay-o.on span{color:var(--gold)}
.err{color:var(--neon);font-weight:700;font-size:13px;margin-top:10px}

/* tracker */
.track{padding:18px 16px}
.track .lang{margin-left:auto;width:max-content}
.ticketbig{margin-top:18px;text-align:center;border-radius:24px;padding:26px 18px 20px;background:linear-gradient(160deg,#2a1b11,#160f0b);border:1px solid rgba(245,166,35,.45);position:relative}
.ticketbig img{width:70px;height:70px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.ticketbig .ok{font-family:'Alfa Slab One',Georgia,serif;text-transform:uppercase;font-size:22px;margin-top:12px;color:#fff}
.ticketbig .lbl{margin:16px 0 0}
.ticketbig .num{font-family:'Alfa Slab One',Georgia,serif;font-size:76px;color:var(--gold);line-height:1.05;text-shadow:0 0 30px rgba(255,122,26,.6)}
.ticketbig .when{color:#bba68a;font-size:13px;margin-top:6px}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px}
.prog div{text-align:center;font-size:11.5px;font-weight:700;color:#6d5b48}
.prog div:before{content:"";display:block;height:6px;border-radius:3px;background:#2e2219;margin-bottom:8px}
.prog .done{color:#dccab0} .prog .done:before{background:var(--gold)}
.prog .now{color:#fff} .prog .now:before{background:var(--neon);box-shadow:0 0 12px var(--neon);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.big-status{margin-top:18px;text-align:center;font-family:'Alfa Slab One',Georgia,serif;text-transform:uppercase;font-size:20px;color:var(--neon)}
.big-status.ready{color:#55d68f;text-shadow:0 0 16px rgba(85,214,143,.5)}
.sum{margin-top:18px;border-top:1px dashed #33261c}

/* ===== kitchen ===== */
#kitchen{min-height:100vh;background:#17120e;color:#fff;padding:14px}
.khead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
.kbrand{display:flex;align-items:center;gap:12px}
.kbrand img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px var(--gold)}
.kbrand .h{font-size:21px} .kbrand small{color:var(--gold2);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.kstats{display:flex;gap:8px;flex-wrap:wrap}
.kstat{background:#271e17;border-radius:12px;padding:8px 14px;font-size:12px;color:#c7b7a6}
.kstat b{display:block;font-size:20px;color:#fff}
.kbtn{padding:10px 14px;border-radius:12px;background:var(--gold);color:var(--blk);font-weight:800;font-size:13px}
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px;overflow-x:auto}
.col{background:#221a14;border-radius:16px;padding:12px;min-height:58vh}
.col h2{font-family:'Alfa Slab One';text-transform:uppercase;font-size:16px;font-weight:400;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:2px 4px}
.col h2 em{font-style:normal;font-family:Rubik;font-weight:800;font-size:13px;background:#3a2c22;border-radius:8px;padding:2px 9px}
.c-new h2{color:var(--gold2)} .c-grill h2{color:var(--neon)} .c-ready h2{color:#55d68f}
.ticket{background:var(--cream);color:var(--blk);border-radius:6px 6px 14px 14px;padding:12px;margin-bottom:10px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.ticket:before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;background:radial-gradient(circle at 6px 6px,#221a14 4px,transparent 4.5px) 0 0/12px 12px repeat-x}
.t-top{display:flex;justify-content:space-between;align-items:baseline}
.t-num{font-family:'Alfa Slab One';font-size:26px}
.t-time{font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--line)}
.t-time.warn{background:var(--gold)} .t-time.late{background:var(--red);color:#fff}
.t-who{font-size:13px;margin:3px 0 8px;color:var(--mute)} .t-who b{color:var(--blk)}
.t-items{border-top:2px dashed #e0c9ad;padding-top:8px;font-size:14px}
.t-items div{margin-bottom:5px} .t-items b{font-size:15px}
.t-items small{display:block;color:#a0552c;font-weight:700;margin-left:22px}
.t-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;font-weight:800}
.pay{padding:3px 8px;border-radius:6px;background:var(--ok);color:#fff} .pay.cash{background:var(--blk);color:var(--gold)}
.bump{width:100%;margin-top:9px;padding:12px;border-radius:10px;font-weight:800;background:var(--blk);color:#fff}
.c-new .bump{background:var(--gold);color:var(--blk)} .c-grill .bump{background:var(--ok);color:#fff}
.empty{color:#8a7a6b;text-align:center;font-size:13px;padding:30px 10px;border:2px dashed #3a2c22;border-radius:12px}
.eighty6{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.eighty6 button{padding:7px 11px;border-radius:999px;background:#271e17;color:#ddd;font-size:12.5px;font-weight:700}
.eighty6 button.out{background:var(--red);color:#fff;text-decoration:line-through}
.klbl{font-size:11.5px;font-weight:800;color:#a8957f;text-transform:uppercase;letter-spacing:.1em;margin-top:22px}
.done-list{margin-top:12px;font-size:13px;color:#a8957f}
.toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:var(--blk);color:var(--gold);font-weight:800;padding:10px 16px;border-radius:12px;z-index:90;animation:drop .3s}
@media (max-width:820px){.board{grid-template-columns:repeat(3,82vw)}}
</style>
</head>
<body>

  <div><b>A3D pitch demo</b> · not live, orders are not real · prices are placeholders</div>

</div>

<main id="customer"></main>
<main id="kitchen" class="hidden"></main>
<div id="layer"></div>

 es:{h1a:"Artesanal.",h1b:"De noche.",sigL:"La de la casa",hrs:"Mar a jue 21:00 a 24:00 · Vie y sáb hasta 01:00",withFries:"con papas",m1:"La cocina tiene tu pedido",m2:"Tu burger está en la parrilla",m3:"¡Listo! Ven a buscarlo",m4:"Disfruta tu burger",hi:"Pide antes, sin hacer fila.",open:"Abierto · hasta",closed:"Abre de martes a sábado 21:00 · pide ya",at:"Estás pidiendo en",call:"Llamar",

};

/* ---------- state ---------- */
let lang="en",tab="burgers",cart=[],view="cust",myOrder=null,seq=60,orders=[],soldOut=new Set();
const t=k=>T[lang][k]??T.en[k];
const f=n=>"ƒ "+n.toFixed(2).replace(".",",");
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- hours (Curaçao UTC-4): Tue-Thu 21:00-24:00, Fri-Sat 21:00-01:00, closed Sun & Mon ---------- */
const HRS={0:null,1:null,2:[1260,1440],3:[1260,1440],4:[1260,1440],5:[1260,1500],6:[1260,1500]};
function openState(){const d=new Date(Date.now()-4*3600e3),day=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();
  const h=HRS[day];if(h&&m>=h[0]&&m<h[1])return{open:true,close:h[1]};
  const p=HRS[(day+6)%7];if(p&&m+1440<p[1])return{open:true,close:p[1]};return{open:false}}
const hhmm=m=>{m%=1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};

/* ---------- customer ---------- */
const SIG="daniels";
const BADGE={veggie:["VEGAN PATTY",""],kids:["KIDS","k"]};
const IC={
 pin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="#F5A623"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 4.5A2.5 2.5 0 1 1 12 11.5 2.5 2.5 0 0 1 12 6.5z"/></svg>',
 clock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5A623" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="#F5A623"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"/></svg>'
};
function langSw(){return `<div class="lang">${["en","pap","es"].map(l=>`<button data-lang="${l}" class="${lang===l?"on":""}">${l.toUpperCase()}</button>`).join("")}</div>`}
const inCart=id=>cart.filter(c=>c.id===id).reduce((a,b)=>a+b.qty,0);
function renderCustomer(){
  if(myOrder) return renderTracker();
  const os=openState(),sig=BURGERS.find(b=>b.id===SIG);
  const cnt=cart.reduce((a,b)=>a+b.qty,0),sum=cart.reduce((a,b)=>a+b.qty*b.price,0);
  const list=LISTS[tab].filter(it=>!(tab==="burgers"&&it.id===SIG));
  const dish=(it,i)=>{const out=soldOut.has(it.id),n=inCart(it.id),bd=BADGE[it.id];return `<button class="dish ${out?"out":""}" data-open="${it.id}">
     <span class="no">${String(i+1).padStart(2,"0")}</span>
     <span class="nm">${esc(it.nm)}${bd?`<span class="tag ${bd[1]}">${bd[0]}</span>`:""}</span>
     <span class="side"><span class="pr">${out?t("sold"):f(it.price)}</span><span class="plus ${n?"inc":""}">${n?n:"+"}</span></span>
     ${it.d?`<span class="d">${esc(it.d)}</span>`:""}</button>`};
  $("#customer").innerHTML=`
  <div class="c-top"><div class="status"><i class="${os.open?"":"off"}"></i>${os.open?`${t("open")} ${hhmm(os.close)}`:t("closed")}</div>${langSw()}</div>
  <header class="hero">
    <img class="logo" src="${IMG.logo}" alt="Daniels Burger">
    <h1>${t("h1a")}<br><em>${t("h1b")}</em></h1>
    <div class="stars">★★★★★</div>
    <p>${t("hi")}</p>
  </header>
  ${sig&&!soldOut.has(SIG)?`<section class="sig"><small>${t("sigL")}</small><div class="nm">${esc(sig.nm)}</div><div class="d">${esc(sig.d)}</div>
    <div class="row"><span class="pr">${f(sig.price)}</span><button class="go" data-open="${SIG}">${t("add")} +</button></div></section>`:""}
  <nav class="tabs">${["burgers","fries","drinks"].map(k=>`<button class="${tab===k?"on":""}" data-tab="${k}">${t(k)}<span>${LISTS[k].length}</span></button>`).join("")}</nav>
  ${tab==="burgers"?`<div class="note">🍟 <span>${t("burgersS")}</span></div>`:""}
  <section class="menu">${list.map(dish).join("")}</section>
  <section class="info">
    <div>${IC.pin}<span>${SPOT.nm}</span></div>
    <div>${IC.clock}<span>${t("hrs")}</span></div>
    <div>${IC.phone}<a href="tel:${SPOT.tel.replace(/\s/g,"")}">${SPOT.tel}</a></div>
  </section>
  <button class="cartbar ${cnt?"":"hidden"}" id="openCart"><span><span class="cnt">${cnt}</span>${t("view")}</span><span>${f(sum)}</span></button>`;
}

function openItem(id){
  const it=ALL.find(x=>x.id===id),isBurger=BURGERS.includes(it),isDrink=DRINKS.includes(it);
  const st={qty:1,adds:[],note:""};
  const price=()=>it.price+st.adds.reduce((a,id)=>a+ADDONS.find(x=>x.id===id).price,0);
  const keep=()=>{const n=$("#inote");if(n)st.note=n.value};
  const draw=()=>{
    $("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet"><div class="grab"></div>
      <div class="h">${esc(it.nm)}</div>${it.d?`<div class="en">${esc(it.d)}</div>`:""}<div class="base">${f(it.price)}${isBurger?` · ${t("withFries")}`:""}</div>
      ${isBurger?`<div class="lbl">${t("extras")}</div><div class="adds">${ADDONS.map(a=>
        `<button class="add ${st.adds.includes(a.id)?"on":""}" data-add="${a.id}">${st.adds.includes(a.id)?"✓ ":""}${a.nm}<span>+${a.price}</span></button>`).join("")}</div>`:""}
      ${isDrink?"":`<div class="lbl">${t("note")}</div><input id="inote" placeholder="${t("notePh")}" value="${esc(st.note)}">`}
      <div class="lbl">${t("qty")}</div><div class="qty"><button data-q="-1">−</button><b>${st.qty}</b><button data-q="1">+</button></div>
      <button class="cta" id="addIt"><span>${t("add")}</span><span>${f(price()*st.qty)}</span></button></div></div>`;
    const s=$(".sheet");
    s.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{keep();const a=b.dataset.add;st.adds.includes(a)?st.adds=st.adds.filter(x=>x!==a):st.adds.push(a);draw()});
    s.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{keep();st.qty=Math.max(1,st.qty+ +b.dataset.q);draw()});
    $("#addIt").onclick=()=>{keep();cart.push({id:it.id,nm:it.nm,detail:st.adds.map(a=>"+ "+ADDONS.find(x=>x.id===a).nm).join(", "),
      note:st.note,qty:st.qty,price:price()});closeLayer();renderCustomer();toast(`${it.nm} ✓`)};
  };draw();
}

let form={name:"",phone:"",when:"asap",pay:"cash"};
function openCart(err){
  const sum=cart.reduce((a,b)=>a+b.qty*b.price,0);
  const slots=[],base=Math.ceil((Date.now()+20*60e3)/(15*60e3))*15*60e3;
  for(let i=0;i<6;i++){const d=new Date(base+i*15*60e3-4*3600e3);slots.push(hhmm(d.getUTCHours()*60+d.getUTCMinutes()))}
  $("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet"><div class="grab"></div>
    <div class="h">${t("your")}</div>
    ${cart.map((c,i)=>`<div class="line"><div><b>${c.qty}× ${esc(c.nm)}</b><div class="x">${esc(c.detail)}${c.note?` · “${esc(c.note)}”`:""}</div>
      <button class="rm" data-rm="${i}">${t("rm")}</button></div><b>${f(c.qty*c.price)}</b></div>`).join("")}
    <div class="tot"><span>${t("total")}</span><span>${f(sum)}</span></div>
    <div class="pickup">${IC.pin}<div><small>${t("pickupAt")}</small><b>Daniels Burger · ${SPOT.nm}</b></div></div>
    <div class="lbl">${t("name")}</div><input id="fname" value="${esc(form.name)}" autocomplete="name">
    <div class="lbl">${t("phone")}</div><input id="fphone" value="${esc(form.phone)}" inputmode="tel" placeholder="+599 9 ...">
    <div class="lbl">${t("when")}</div><select id="fwhen"><option value="asap">${t("asap")}</option>${slots.map(s=>`<option ${form.when===s?"selected":""}>${s}</option>`).join("")}</select>
    <div class="lbl">${t("payw")}</div><div class="paygrid">
      <button class="pay-o ${form.pay==="cash"?"on":""}" data-pay="cash"><b>${t("cash")}</b><span>ƒ XCG</span></button>
      <button class="pay-o ${form.pay==="sentoo"?"on":""}" data-pay="sentoo"><b>${t("online")}</b><span>${t("sentoo")}</span></button></div>
    ${err?`<div class="err">${t("need")}</div>`:""}
    <button class="cta" id="place"><span>${t("place")}</span><span>${f(sum)}</span></button>
    <button class="ghost" data-closebtn>${t("keep")}</button></div></div>`;
  const save=()=>{form.name=$("#fname").value.trim();form.phone=$("#fphone").value.trim();form.when=$("#fwhen").value};
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{save();cart.splice(+b.dataset.rm,1);renderCustomer();cart.length?openCart():closeLayer()});
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{save();form.pay=b.dataset.pay;openCart()});
  $("#place").onclick=()=>{save();if(!form.name||form.phone.replace(/\D/g,"").length<6)return openCart(true);
    const o={id:Date.now(),num:++seq,name:form.name,phone:form.phone,items:cart.map(c=>({...c})),total:sum,pay:form.pay,status:"new",created:Date.now(),when:form.when};
    orders.push(o);myOrder=o.id;cart=[];closeLayer();renderCustomer();try{scrollTo(0,0)}catch(e){}renderKitchen();toast(`#${o.num} sent to the kitchen`)};
}

function renderTracker(){
  const o=orders.find(x=>x.id===myOrder),idx={new:0,grill:1,ready:2,done:3}[o.status];
  const msg=["m1","m2","m3","m4"][idx];
  $("#customer").innerHTML=`<section class="track">${langSw()}
    <div class="ticketbig"><img src="${IMG.logo}" alt=""><div class="ok">${t("inn")}</div>
      <div class="lbl">${t("show")}</div><div class="num">#${o.num}</div>
      <div class="when">Daniels Burger · ${o.when==="asap"?t("asap"):o.when}</div>
      <div class="prog">${["s1","s2","s3","s4"].map((s,i)=>`<div class="${idx===3||i<idx?"done":i===idx?"now":""}">${t(s)}</div>`).join("")}</div>
    </div>
    <div class="big-status ${idx===2?"ready":""}">${t(msg)}</div>
    <div class="sum">${o.items.map(i=>`<div class="line"><div><b>${i.qty}× ${esc(i.nm)}</b>${i.detail?`<div class="x">${esc(i.detail)}</div>`:""}</div><b>${f(i.qty*i.price)}</b></div>`).join("")}
    <div class="tot"><span>${o.pay==="cash"?t("cash"):"Sentoo ✓"}</span><span>${f(o.total)}</span></div></div>
    <button class="ghost" id="again" style="margin-top:18px">${t("again")}</button></section>`;
}

/* ---------- kitchen ---------- */
const age=o=>Math.floor((Date.now()-o.created)/60000);
function renderKitchen(){
  const live=orders.filter(o=>o.status!=="done"),done=orders.filter(o=>o.status==="done");
  const cols=[["new","New","Start grilling"],["grill","On the grill","Ready"],["ready","Ready for pickup","Picked up"]];
  $("#kitchen").innerHTML=`<div class="khead">
    <div class="kbrand"><img src="${IMG.logo}" alt=""><div><small>Kitchen board</small><div class="h">Daniels Burger</div></div></div>
    <div class="kstats"><div class="kstat">Open<b>${live.length}</b></div><div class="kstat">Tonight<b>${orders.length}</b></div>
      <div class="kstat">Sales<b>${f(orders.reduce((a,o)=>a+o.total,0))}</b></div><button class="kbtn" id="sim">+ Test order</button></div></div>
  <div class="board">${cols.map(([s,h,b])=>{const l=live.filter(o=>o.status===s).sort((a,b)=>a.created-b.created);
    return `<div class="col c-${s}"><h2>${h}<em>${l.length}</em></h2>${l.length?l.map(o=>{const a=age(o);return `<div class="ticket">
      <div class="t-top"><span class="t-num">#${o.num}</span><span class="t-time ${a>=20?"late":a>=10?"warn":""}">${a} min</span></div>
      <div class="t-who"><b>${esc(o.name)}</b> · ${esc(o.phone)} · ${o.when==="asap"?"ASAP":"Pickup "+o.when}</div>
      <div class="t-items">${o.items.map(i=>`<div><b>${i.qty}×</b> ${esc(i.nm)}${i.detail?`<small>${esc(i.detail)}</small>`:""}${i.note?`<small>↳ ${esc(i.note)}</small>`:""}</div>`).join("")}</div>
      <div class="t-foot"><span class="pay ${o.pay==="cash"?"cash":""}">${o.pay==="cash"?"PAY AT PICKUP":"PAID SENTOO"}</span><span>${f(o.total)}</span></div>
      <button class="bump" data-bump="${o.id}">${b} →</button></div>`}).join(""):`<div class="empty">No tickets</div>`}</div>`}).join("")}</div>
  <div class="klbl">Sold out tonight · tap to switch off on the ordering site</div>
  <div class="eighty6">${[...BURGERS,...FRIES].map(i=>`<button data-86="${i.id}" class="${soldOut.has(i.id)?"out":""}">${esc(i.nm)}</button>`).join("")}</div>
  ${done.length?`<div class="done-list">Picked up: ${done.map(o=>"#"+o.num).join(", ")}</div>`:""}`;
  const n=live.filter(o=>o.status==="new").length,bd=$("#kBadge");bd.textContent=n;bd.classList.toggle("hidden",!n);
}

/* ---------- test orders ---------- */
const NAMES=["Jurgen","Shaline","Ricardo","Naomi","Gino","Kenrick","Maritza","Dwayne","Yaniska","Edsel","Rignald","Chanella"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function sim(ago=0){
  const items=[],n=1+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){const r=Math.random();
    if(r<.65){const b=rnd(BURGERS),adds=Math.random()<.4?[rnd(ADDONS)]:[];
      items.push({nm:b.nm,detail:adds.map(a=>"+ "+a.nm).join(", "),qty:Math.random()<.25?2:1,price:b.price+adds.reduce((x,a)=>x+a.price,0),note:Math.random()<.2?rnd(["No pickles","Sauce on the side","Well done"]):""})}
    else if(r<.85){const fr=rnd(FRIES);items.push({nm:fr.nm,detail:"",qty:1,price:fr.price,note:""})}
    else{const d=rnd(DRINKS);items.push({nm:d.nm,detail:"",qty:Math.random()<.4?2:1,price:d.price,note:""})}}
  const o={id:Date.now()+Math.random(),num:++seq,name:rnd(NAMES),phone:"+599 9 "+(5100000+Math.floor(Math.random()*899999)).toString().replace(/(\d{3})(\d{4})/,"$1 $2"),
    items,total:items.reduce((a,b)=>a+b.qty*b.price,0),pay:Math.random()<.6?"cash":"sentoo",status:"new",created:Date.now()-ago*60000,when:"asap"};
  orders.push(o);return o;
}
sim(22).status="ready";sim(14).status="grill";sim(9).status="grill";sim(4);sim(1);

/* ---------- events ---------- */
function closeLayer(){$("#layer").innerHTML=""}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
function setView(v){view=v;$("#customer").classList.toggle("hidden",v!=="cust");$("#kitchen").classList.toggle("hidden",v!=="kit");
  $("#vCust").classList.toggle("on",v==="cust");$("#vKit").classList.toggle("on",v==="kit");try{scrollTo(0,0)}catch(e){}}
$("#vCust").onclick=()=>{setView("cust");renderCustomer()};
$("#vKit").onclick=()=>{setView("kit");renderKitchen()};
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let b;
  if(e.target.matches("[data-close]")||g("[data-closebtn]"))return closeLayer();
  if(b=g("[data-lang]")){lang=b.dataset.lang;return renderCustomer()}
  if(b=g("[data-tab]")){tab=b.dataset.tab;return renderCustomer()}
  if(b=g("[data-open]"))return openItem(b.dataset.open);
  if(g("#openCart"))return openCart();
  if(g("#again")){myOrder=null;return renderCustomer()}
  if(b=g("[data-bump]")){const o=orders.find(x=>String(x.id)===b.dataset.bump);o.status={new:"grill",grill:"ready",ready:"done"}[o.status];
    renderKitchen();if(o.id===myOrder)renderCustomer();if(o.status==="ready")toast(`#${o.num} ready · WhatsApp sent to ${o.name}`);return}
  if(b=g("[data-86]")){const id=b.dataset["86"];soldOut.has(id)?soldOut.delete(id):soldOut.add(id);renderKitchen();return renderCustomer()}
  if(g("#sim")){const o=sim();renderKitchen();return toast(`New order #${o.num}`)}
});
setInterval(()=>{if(view==="kit")renderKitchen()},30000);
renderCustomer();renderKitchen();
</script>
</body>
