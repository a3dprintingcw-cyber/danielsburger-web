<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniels Burger · Ordering demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="images.js"></script>
<style>
:root{
  --gold:#F5A623; --gold2:#FFC75A; --neon:#FF7A1A; --red:#C8321F; --blk:#14100D; --wood:#2B1D14; --wood2:#3A281C;
  --cream:#FBF3E6; --line:#EADBC4; --mute:#7C6A58; --ok:#1E9E57;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--blk);font-family:'Rubik',system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--blk);background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.h{font-family:'Alfa Slab One',Georgia,serif;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;font-weight:400}

/* demo bar (pitch controls, not part of the app) */
.demobar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between;
  padding:8px 12px;background:#2a2a2a;color:#ccc;font-size:12px}
.demobar b{color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chips button{padding:5px 10px;border-radius:999px;background:#444;color:#ddd;font-weight:700;font-size:12px}
.chips button.on{background:var(--gold);color:var(--blk)}
.badge{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;margin-left:4px;padding:0 4px}

/* ===== customer app ===== */
#customer{max-width:470px;margin:0 auto;min-height:100vh;background:var(--cream);padding-bottom:110px;position:relative}
.top{background:radial-gradient(120% 90% at 50% 0%,#4a3222 0%,var(--wood) 55%,var(--blk) 100%);color:#fff;padding:14px 16px 0;position:relative;overflow:hidden}
.top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--cream);border-radius:26px 26px 0 0}
.toprow{display:flex;justify-content:space-between;align-items:center}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;font-size:12px;font-weight:800}
.lang button{padding:5px 9px;border-radius:999px}
.lang button.on{background:var(--gold);color:var(--blk)}
.open{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:999px}
.open i{width:8px;height:8px;border-radius:50%;background:#3ddc84} .open i.off{background:var(--neon)}
.brand{display:flex;flex-direction:column;align-items:center;padding:12px 0 36px;position:relative;z-index:1}
.brand img{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 4px var(--gold),0 0 28px rgba(255,122,26,.55)}
.brand p{margin-top:14px;font-weight:700;font-size:14px;text-align:center;color:#f3e3cc}
.spot{margin:-6px 16px 0;position:relative;z-index:2;background:var(--blk);color:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.pin{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.spot small{display:block;color:var(--gold2);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.spot .h{font-size:20px;margin-top:3px}
.spot .ph{font-size:12.5px;color:#bbb;margin-top:3px}
.cats{display:flex;gap:14px;overflow-x:auto;padding:20px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;width:66px}
.cat .ring{width:64px;height:64px;border-radius:50%;padding:3px;border:3px solid var(--line)}
.cat.on .ring{border-color:var(--neon)}
.cat .bub{width:100%;height:100%;border-radius:50%;background:var(--wood);display:grid;place-items:center}
.cat svg{width:28px;height:28px}
.sec{padding:8px 16px}
.sec .h{font-size:25px;margin:10px 0 4px}
.sec .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px}
.item .nm{font-family:'Alfa Slab One',Georgia,serif;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.item .en{color:var(--mute);font-size:12.5px;margin-top:3px;line-height:1.35}
.item .pr{margin-top:6px;font-weight:800;color:var(--red);font-size:14px}
.item .grow{flex:1}
.plus{flex:none;width:40px;height:40px;border-radius:12px;background:var(--blk);color:var(--gold);font-size:24px;font-weight:800;display:grid;place-items:center}
.item.out{opacity:.45;pointer-events:none}
.item.out .pr{color:var(--mute)}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:min(438px,calc(100% - 28px));z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:16px 18px;border-radius:18px;background:var(--blk);color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.cartbar .cnt{background:var(--gold);color:var(--blk);border-radius:8px;padding:1px 8px;margin-right:8px}
.hidden{display:none!important}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,13,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(470px,100%);max-height:90vh;overflow:auto;background:var(--cream);border-radius:24px 24px 0 0;padding:20px 16px 24px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .h{font-size:26px}
.sheet .en{color:var(--mute);margin:6px 0 6px;font-size:14px}
.lbl{font-size:11.5px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.opt b{font-size:14px} .opt span{font-size:13px;font-weight:800;color:var(--red);white-space:nowrap}
.opt.on{border-color:var(--blk);background:var(--gold)} .opt.on span{color:var(--blk)}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:44px;height:44px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:22px;font-weight:800}
.qty b{min-width:20px;text-align:center;font-size:20px}
.cta{width:100%;margin-top:18px;padding:16px 18px;border-radius:16px;background:var(--blk);color:#fff;font-weight:800;font-size:16px;display:flex;justify-content:space-between}
.cta span:last-child{color:var(--gold2)}
.ghost{width:100%;margin-top:8px;padding:13px;border-radius:16px;border:2px solid var(--line);font-weight:800;color:var(--mute);background:#fff}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:2px dashed var(--line)}
.line .x{color:var(--mute);font-size:13px}
.rm{color:var(--red);font-size:12px;font-weight:800;margin-top:4px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:12px}
.confirmspot{margin-top:16px;background:var(--blk);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.confirmspot .pin{width:36px;height:36px}
.confirmspot small{color:var(--gold2);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block}
.confirmspot b{font-size:16px}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paygrid .opt{flex-direction:column;align-items:flex-start}
.err{color:var(--red);font-weight:700;font-size:13px;margin-top:10px}

/* tracker */
.track{padding:0 16px}
.trackhead{background:radial-gradient(120% 100% at 50% 0%,#4a3222,var(--blk));color:#fff;margin:0 -16px;padding:18px 16px 30px;text-align:center;border-radius:0 0 26px 26px}
.trackhead img{width:90px;height:90px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 0 20px rgba(255,122,26,.5)}
.trackhead .h{font-size:24px;margin-top:12px}
.ticketbig{background:#fff;border:2px solid var(--line);border-radius:20px;margin-top:-14px;padding:18px;text-align:center;position:relative}
.ticketbig .num{font-family:'Alfa Slab One';font-size:68px;color:var(--red);line-height:1.1}
.ticketbig .where{margin-top:10px;background:var(--blk);color:#fff;border-radius:14px;padding:10px;font-weight:800}
.ticketbig .where span{color:var(--gold2)}
.steps{margin-top:16px;display:grid;gap:8px}
.step{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:800;color:#bba792}
.step i{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px}
.step.done{color:var(--blk)} .step.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now{color:var(--blk);border-color:var(--gold);background:#FFF1DA} .step.now i{border-color:var(--gold);background:var(--gold);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(245,166,35,.3)}}

/* ===== kitchen ===== */
#kitchen{min-height:100vh;background:#17120e;color:#fff;padding:14px}
.khead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
.kbrand{display:flex;align-items:center;gap:12px}
.kbrand img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px var(--gold)}
.kbrand .h{font-size:21px} .kbrand small{color:var(--gold2);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.kstats{display:flex;gap:8px;flex-wrap:wrap}
.kstat{background:#271e17;border-radius:12px;padding:8px 14px;font-size:12px;color:#c7b7a6}
.kstat b{display:block;font-size:20px;color:#fff}
.kbtn{padding:10px 14px;border-radius:12px;background:var(--gold);color:var(--blk);font-weight:800;font-size:13px}
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px;overflow-x:auto}
.col{background:#221a14;border-radius:16px;padding:12px;min-height:58vh}
.col h2{font-family:'Alfa Slab One';text-transform:uppercase;font-size:16px;font-weight:400;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:2px 4px}
.col h2 em{font-style:normal;font-family:Rubik;font-weight:800;font-size:13px;background:#3a2c22;border-radius:8px;padding:2px 9px}
.c-new h2{color:var(--gold2)} .c-grill h2{color:var(--neon)} .c-ready h2{color:#55d68f}
.ticket{background:var(--cream);color:var(--blk);border-radius:6px 6px 14px 14px;padding:12px;margin-bottom:10px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.ticket:before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;background:radial-gradient(circle at 6px 6px,#221a14 4px,transparent 4.5px) 0 0/12px 12px repeat-x}
.t-top{display:flex;justify-content:space-between;align-items:baseline}
.t-num{font-family:'Alfa Slab One';font-size:26px}
.t-time{font-weight:800;font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--line)}
.t-time.warn{background:var(--gold)} .t-time.late{background:var(--red);color:#fff}
.t-who{font-size:13px;margin:3px 0 8px;color:var(--mute)} .t-who b{color:var(--blk)}
.t-items{border-top:2px dashed #e0c9ad;padding-top:8px;font-size:14px}
.t-items div{margin-bottom:5px} .t-items b{font-size:15px}
.t-items small{display:block;color:#a0552c;font-weight:700;margin-left:22px}
.t-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;font-weight:800}
.pay{padding:3px 8px;border-radius:6px;background:var(--ok);color:#fff} .pay.cash{background:var(--blk);color:var(--gold)}
.bump{width:100%;margin-top:9px;padding:12px;border-radius:10px;font-weight:800;background:var(--blk);color:#fff}
.c-new .bump{background:var(--gold);color:var(--blk)} .c-grill .bump{background:var(--ok);color:#fff}
.empty{color:#8a7a6b;text-align:center;font-size:13px;padding:30px 10px;border:2px dashed #3a2c22;border-radius:12px}
.eighty6{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.eighty6 button{padding:7px 11px;border-radius:999px;background:#271e17;color:#ddd;font-size:12.5px;font-weight:700}
.eighty6 button.out{background:var(--red);color:#fff;text-decoration:line-through}
.klbl{font-size:11.5px;font-weight:800;color:#a8957f;text-transform:uppercase;letter-spacing:.1em;margin-top:22px}
.done-list{margin-top:12px;font-size:13px;color:#a8957f}
.toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:var(--blk);color:var(--gold);font-weight:800;padding:10px 16px;border-radius:12px;z-index:90;animation:drop .3s}
@media (max-width:820px){.board{grid-template-columns:repeat(3,82vw)}}
</style>
</head>
<body>

<div class="demobar">
  <div><b>A3D pitch demo</b> · not live, orders are not real · prices are placeholders</div>
  <div class="chips"><button id="vCust" class="on">Customer phone</button><button id="vKit">Kitchen screen<span id="kBadge" class="badge hidden">0</span></button></div>
</div>

<main id="customer"></main>
<main id="kitchen" class="hidden"></main>
<div id="layer"></div>

<script>
/* ---------- location ---------- */
const SPOT={nm:"Caracasbaaiweg, Bottelier",tel:"+599 9 678 2706"};

/* ---------- menu (from the Daniels Burger menu board; PRICES ARE PLACEHOLDERS, confirm with Daniels) ---------- */
const BURGERS=[
 {id:"felisidat",nm:"Felisidat",d:"Angus meat 8oz · American cheese · bacon · fresh onion · pickles · lettuce · tomato · special sauce",price:20},
 {id:"simplesa",nm:"Simplesa",d:"Angus meat 8oz · American cheese · bacon · special sauce",price:18},
 {id:"veggie",nm:"Veggie",d:"Vegan patty · tomato · lettuce · pickles · onions · honey mustard · special sauce",price:18},
 {id:"amores",nm:"Amores",d:"Double beef smash Angus · American cheese · bacon · caramelized onions · special sauce · BBQ sauce",price:22},
 {id:"besito",nm:"Besito",d:"Angus meat 8oz · American cheese · bacon · caramelized onions · pickles · lettuce · honey mustard · smoked ham · drizzled homemade syrup",price:24},
 {id:"smashy",nm:"Smashy Burger",d:"Triple smashed Angus meat · American cheese · bacon · caramelized onions · special sauce",price:24},
 {id:"daniels",nm:"Daniels Burger",d:"Double Angus meat 8oz · American cheese · bacon · caramelized onions · pickles · lettuce · honey mustard · special sauce",price:28},
 {id:"kids",nm:"Daniels Kids",d:"Angus meat 6oz · American cheese · bacon · special sauce · with a kids juice",price:14},
];
const FRIES=[
 {id:"loaded",nm:"Loaded Fries",d:"Crispy french fries · cheese · bacon · special sauce",price:12},
 {id:"patty",nm:"Patty Fries",d:"Fries topped with patty, cheese and homemade sauce",price:14},
 {id:"french",nm:"French Fries",d:"Crispy and golden",price:5},
];
const DRINKS=[ /* not on the menu board, confirm with Daniels */
 {id:"awa",nm:"Awa",price:3},{id:"pop",nm:"Soda",price:4},{id:"djus",nm:"Djus",price:4},
 {id:"arizona",nm:"Arizona",price:5},{id:"bright",nm:"Amstel Bright",price:6},{id:"polar",nm:"Polar",price:5}
];
const ADDONS=[
 {id:"cheese",nm:"Cheese",price:2},{id:"bacon",nm:"Bacon",price:3},{id:"ham",nm:"Smoked ham",price:3},
 {id:"caro",nm:"Caramelized onions",price:2},{id:"patty8",nm:"Patty 8oz",price:8},{id:"smash",nm:"Smashed patty",price:6},
 {id:"lettuce",nm:"Lettuce",price:1},{id:"tomato",nm:"Tomato",price:1},{id:"pickles",nm:"Pickles",price:1},{id:"fonion",nm:"Fresh onions",price:1}
];
const LISTS={burgers:BURGERS,fries:FRIES,drinks:DRINKS};
const ALL=[...BURGERS,...FRIES,...DRINKS];

const ICO={
 burgers:'<svg viewBox="0 0 24 24" fill="#F5A623"><path d="M4 10a8 6 0 0 1 16 0zm-1 2h18v2H3zm1 4h16a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/></svg>',
 fries:'<svg viewBox="0 0 24 24" fill="#F5A623"><path d="M6 3h2v7H6zm4-1h2v8h-2zm4 1h2v7h-2zM4 10h16l-2 12H6z"/></svg>',
 drinks:'<svg viewBox="0 0 24 24" fill="#F5A623"><path d="M6 6h12l-1.5 16h-9zM14 1l1 5h-2l-.6-3H9V1z"/></svg>'
};
const PIN='<svg width="22" height="22" viewBox="0 0 24 24" fill="#14100D"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 4.5A2.5 2.5 0 1 1 12 11.5 2.5 2.5 0 0 1 12 6.5z"/></svg>';

const T={
 en:{hi:"Handcrafted burgers, late night. Order ahead, skip the line.",open:"Open · until",closed:"Opens Tue to Sat 21:00 · pre-order now",at:"You're ordering at",call:"Call",
  burgers:"Burgers",fries:"Fries",drinks:"Drinks",burgersS:"All burgers come with french fries.",friesS:"",
  view:"View order",add:"Add",extras:"Add ons",qty:"How many",note:"Note for the kitchen",notePh:"No pickles, sauce on the side...",
  your:"Your order",pickupAt:"Pick up at",name:"Name",phone:"WhatsApp number",when:"Pickup time",asap:"As soon as it's ready",payw:"Payment",
  cash:"Pay at pickup",online:"Pay now",sentoo:"Sentoo",place:"Send order",total:"Total",keep:"Add more",need:"Fill in your name and WhatsApp so we can let you know when it's ready.",
  inn:"Order received!",show:"Show this number at pickup",s1:"Received",s2:"On the grill",s3:"Ready, come get it",s4:"Picked up",again:"New order",rm:"Remove",sold:"Sold out tonight",fries:"Fries"},
 pap:{hi:"Burger hecho na man, anochi lat. Pidi promé, no hasi fila.",open:"Habrí · te",closed:"Ta habri djamars te djasabra 21:00 · pidi awor kaba",at:"Bo ta pidi na",call:"Yama",
  burgers:"Burger",fries:"Fries",drinks:"Bebida",burgersS:"Tur burger ta bini ku fries.",friesS:"",
  view:"Mira bo pedido",add:"Agregá",extras:"Ekstra",qty:"Kuantu",note:"Nota pa kushina",notePh:"Sin pickles, saus na banda...",
  your:"Bo pedido",pickupAt:"Bin buska na",name:"Nòmber",phone:"Number di WhatsApp",when:"Ora di buska",asap:"Asina ku e kla",payw:"Pago",
  cash:"Paga ora bo buska",online:"Paga awor",sentoo:"Sentoo",place:"Manda pedido",total:"Total",keep:"Agregá mas",need:"Yena bo nòmber i WhatsApp pa nos laga bo sa ora e kla.",

 es:{hi:"Hamburguesas artesanales, de noche. Pide antes, sin hacer fila.",open:"Abierto · hasta",closed:"Abre de martes a sábado 21:00 · pide ya",at:"Estás pidiendo en",call:"Llamar",
  burgers:"Burgers",fries:"Papas",drinks:"Bebidas",burgersS:"Todas las burgers vienen con papas fritas.",friesS:"",
  view:"Ver pedido",add:"Agregar",extras:"Extras",qty:"Cantidad",note:"Nota para la cocina",notePh:"Sin pepinillos, salsa aparte...",
  your:"Tu pedido",pickupAt:"Recoger en",name:"Nombre",phone:"Número de WhatsApp",when:"Hora de recogida",asap:"Apenas esté listo",payw:"Pago",
  cash:"Pagar al recoger",online:"Pagar ahora",sentoo:"Sentoo",place:"Enviar pedido",total:"Total",keep:"Agregar más",need:"Pon tu nombre y WhatsApp para avisarte cuando esté listo.",
  inn:"¡Pedido recibido!",show:"Muestra este número al recoger",s1:"Recibido",s2:"En la parrilla",s3:"Listo, ven a buscarlo",s4:"Recogido",again:"Nuevo pedido",rm:"Quitar",sold:"Agotado hoy"}
};

/* ---------- state ---------- */
let lang="en",tab="burgers",cart=[],view="cust",myOrder=null,seq=60,orders=[],soldOut=new Set();
const t=k=>T[lang][k]??T.en[k];
const f=n=>"ƒ "+n.toFixed(2).replace(".",",");
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- hours (Curaçao UTC-4): Tue-Thu 21:00-24:00, Fri-Sat 21:00-01:00, closed Sun & Mon ---------- */
const HRS={0:null,1:null,2:[1260,1440],3:[1260,1440],4:[1260,1440],5:[1260,1500],6:[1260,1500]};
function openState(){const d=new Date(Date.now()-4*3600e3),day=d.getUTCDay(),m=d.getUTCHours()*60+d.getUTCMinutes();
  const h=HRS[day];if(h&&m>=h[0]&&m<h[1])return{open:true,close:h[1]};
  const p=HRS[(day+6)%7];if(p&&m+1440<p[1])return{open:true,close:p[1]};return{open:false}}
const hhmm=m=>{m%=1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};

/* ---------- customer ---------- */
function langSw(){return `<div class="lang">${["en","pap","es"].map(l=>`<button data-lang="${l}" class="${lang===l?"on":""}">${l.toUpperCase()}</button>`).join("")}</div>`}
function renderCustomer(){
  if(myOrder) return renderTracker();
  const os=openState();
  const cnt=cart.reduce((a,b)=>a+b.qty,0),sum=cart.reduce((a,b)=>a+b.qty*b.price,0);
  const card=it=>{const out=soldOut.has(it.id);return `<button class="item ${out?"out":""}" data-open="${it.id}">
     <div class="grow"><div class="nm">${esc(it.nm)}</div>${it.d?`<div class="en">${esc(it.d)}</div>`:""}
     <div class="pr">${out?t("sold"):f(it.price)}</div></div><div class="plus">+</div></button>`};
  $("#customer").innerHTML=`
  <header class="top">
    <div class="toprow"><div class="open"><i class="${os.open?"":"off"}"></i>${os.open?`${t("open")} ${hhmm(os.close)}`:t("closed")}</div>${langSw()}</div>
    <div class="brand"><img src="${IMG.logo}" alt="Daniels Burger"><p>${t("hi")}</p></div>
  </header>
  <div class="spot"><div class="pin">${PIN}</div><div><small>${t("at")}</small><div class="h">Daniels Burger</div><div class="ph">${SPOT.nm} · ${SPOT.tel}</div></div></div>
  <nav class="cats">${["burgers","fries","drinks"].map(k=>`<button class="cat ${tab===k?"on":""}" data-tab="${k}"><span class="ring"><span class="bub">${ICO[k]}</span></span>${t(k)}</button>`).join("")}</nav>
  <section class="sec"><div class="h">${t(tab)}</div><div class="sub">${t(tab+"S")||""}</div>${LISTS[tab].map(card).join("")}</section>
  <button class="cartbar ${cnt?"":"hidden"}" id="openCart"><span><span class="cnt">${cnt}</span>${t("view")}</span><span>${f(sum)}</span></button>`;
}

function openItem(id){
  const it=ALL.find(x=>x.id===id),isBurger=BURGERS.includes(it),isDrink=DRINKS.includes(it);
  const st={qty:1,adds:[],note:""};
  const price=()=>it.price+st.adds.reduce((a,id)=>a+ADDONS.find(x=>x.id===id).price,0);
  const keep=()=>{const n=$("#inote");if(n)st.note=n.value};
  const draw=()=>{
    $("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet">
      <div class="h">${esc(it.nm)}</div>${it.d?`<div class="en">${esc(it.d)}</div>`:""}
      ${isBurger?`<div class="lbl">${t("extras")}</div><div class="opts">${ADDONS.map(a=>
        `<button class="opt ${st.adds.includes(a.id)?"on":""}" data-add="${a.id}"><b>${a.nm}</b><span>+${f(a.price)}</span></button>`).join("")}</div>`:""}
      ${isDrink?"":`<div class="lbl">${t("note")}</div><input id="inote" placeholder="${t("notePh")}" value="${esc(st.note)}">`}
      <div class="lbl">${t("qty")}</div><div class="qty"><button data-q="-1">−</button><b>${st.qty}</b><button data-q="1">+</button></div>
      <button class="cta" id="addIt"><span>${t("add")}</span><span>${f(price()*st.qty)}</span></button></div></div>`;
    const s=$(".sheet");
    s.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{keep();const a=b.dataset.add;st.adds.includes(a)?st.adds=st.adds.filter(x=>x!==a):st.adds.push(a);draw()});
    s.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{keep();st.qty=Math.max(1,st.qty+ +b.dataset.q);draw()});
    $("#addIt").onclick=()=>{keep();cart.push({id:it.id,nm:it.nm,detail:st.adds.map(a=>"+ "+ADDONS.find(x=>x.id===a).nm).join(", "),
      note:st.note,qty:st.qty,price:price()});closeLayer();renderCustomer()};
  };draw();
}

let form={name:"",phone:"",when:"asap",pay:"cash"};
function openCart(err){
  const sum=cart.reduce((a,b)=>a+b.qty*b.price,0);
  const slots=[],base=Math.ceil((Date.now()+20*60e3)/(15*60e3))*15*60e3;
  for(let i=0;i<6;i++){const d=new Date(base+i*15*60e3-4*3600e3);slots.push(hhmm(d.getUTCHours()*60+d.getUTCMinutes()))}
  $("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet">
    <div class="h">${t("your")}</div>
    ${cart.map((c,i)=>`<div class="line"><div><b>${c.qty}× ${esc(c.nm)}</b><div class="x">${esc(c.detail)}${c.note?` · “${esc(c.note)}”`:""}</div>
      <button class="rm" data-rm="${i}">${t("rm")}</button></div><b>${f(c.qty*c.price)}</b></div>`).join("")}
    <div class="tot"><span>${t("total")}</span><span>${f(sum)}</span></div>
    <div class="confirmspot"><div class="pin">${PIN}</div><div><small>${t("pickupAt")}</small><b>Daniels Burger · ${SPOT.nm}</b></div></div>
    <div class="lbl">${t("name")}</div><input id="fname" value="${esc(form.name)}" autocomplete="name">
    <div class="lbl">${t("phone")}</div><input id="fphone" value="${esc(form.phone)}" inputmode="tel" placeholder="+599 9 ...">
    <div class="lbl">${t("when")}</div><select id="fwhen"><option value="asap">${t("asap")}</option>${slots.map(s=>`<option ${form.when===s?"selected":""}>${s}</option>`).join("")}</select>
    <div class="lbl">${t("payw")}</div><div class="paygrid">
      <button class="opt ${form.pay==="cash"?"on":""}" data-pay="cash"><b>${t("cash")}</b><span>ƒ XCG</span></button>
      <button class="opt ${form.pay==="sentoo"?"on":""}" data-pay="sentoo"><b>${t("online")}</b><span>${t("sentoo")}</span></button></div>
    ${err?`<div class="err">${t("need")}</div>`:""}
    <button class="cta" id="place"><span>${t("place")}</span><span>${f(sum)}</span></button>
    <button class="ghost" data-closebtn>${t("keep")}</button></div></div>`;
  const save=()=>{form.name=$("#fname").value.trim();form.phone=$("#fphone").value.trim();form.when=$("#fwhen").value};
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{save();cart.splice(+b.dataset.rm,1);renderCustomer();cart.length?openCart():closeLayer()});
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{save();form.pay=b.dataset.pay;openCart()});
  $("#place").onclick=()=>{save();if(!form.name||form.phone.replace(/\D/g,"").length<6)return openCart(true);
    const o={id:Date.now(),num:++seq,name:form.name,phone:form.phone,items:cart.map(c=>({...c})),total:sum,pay:form.pay,status:"new",created:Date.now(),when:form.when};
    orders.push(o);myOrder=o.id;cart=[];closeLayer();renderCustomer();renderKitchen();toast(`#${o.num} sent to the kitchen`)};
}

function renderTracker(){
  const o=orders.find(x=>x.id===myOrder),idx={new:0,grill:1,ready:2,done:3}[o.status];
  $("#customer").innerHTML=`<section class="track">
    <div class="trackhead"><div class="toprow" style="justify-content:flex-end">${langSw()}</div>
      <img src="${IMG.logo}" alt=""><div class="h">${t("inn")}</div></div>
    <div class="ticketbig"><div class="lbl" style="margin:0">${t("show")}</div><div class="num">#${o.num}</div>
      <div class="where">${t("pickupAt")} <span>Daniels Burger</span> · ${o.when==="asap"?t("asap"):o.when}</div></div>
    <div class="steps">${["s1","s2","s3","s4"].map((s,i)=>{const c=idx===3||i<idx?"done":i===idx?"now":"";return `<div class="step ${c}"><i>${c==="done"?"✓":i+1}</i>${t(s)}</div>`}).join("")}</div>
    <div class="line" style="margin-top:14px"><span>${o.items.reduce((a,b)=>a+b.qty,0)}× · ${o.pay==="cash"?t("cash"):"Sentoo"}</span><b>${f(o.total)}</b></div>
    <button class="ghost" id="again" style="margin-top:16px">${t("again")}</button></section>`;
}

/* ---------- kitchen ---------- */
const age=o=>Math.floor((Date.now()-o.created)/60000);
function renderKitchen(){
  const live=orders.filter(o=>o.status!=="done"),done=orders.filter(o=>o.status==="done");
  const cols=[["new","New","Start grilling"],["grill","On the grill","Ready"],["ready","Ready for pickup","Picked up"]];
  $("#kitchen").innerHTML=`<div class="khead">
    <div class="kbrand"><img src="${IMG.logo}" alt=""><div><small>Kitchen board</small><div class="h">Daniels Burger</div></div></div>
    <div class="kstats"><div class="kstat">Open<b>${live.length}</b></div><div class="kstat">Tonight<b>${orders.length}</b></div>
      <div class="kstat">Sales<b>${f(orders.reduce((a,o)=>a+o.total,0))}</b></div><button class="kbtn" id="sim">+ Test order</button></div></div>
  <div class="board">${cols.map(([s,h,b])=>{const l=live.filter(o=>o.status===s).sort((a,b)=>a.created-b.created);
    return `<div class="col c-${s}"><h2>${h}<em>${l.length}</em></h2>${l.length?l.map(o=>{const a=age(o);return `<div class="ticket">
      <div class="t-top"><span class="t-num">#${o.num}</span><span class="t-time ${a>=20?"late":a>=10?"warn":""}">${a} min</span></div>
      <div class="t-who"><b>${esc(o.name)}</b> · ${esc(o.phone)} · ${o.when==="asap"?"ASAP":"Pickup "+o.when}</div>
      <div class="t-items">${o.items.map(i=>`<div><b>${i.qty}×</b> ${esc(i.nm)}${i.detail?`<small>${esc(i.detail)}</small>`:""}${i.note?`<small>↳ ${esc(i.note)}</small>`:""}</div>`).join("")}</div>
      <div class="t-foot"><span class="pay ${o.pay==="cash"?"cash":""}">${o.pay==="cash"?"PAY AT PICKUP":"PAID SENTOO"}</span><span>${f(o.total)}</span></div>
      <button class="bump" data-bump="${o.id}">${b} →</button></div>`}).join(""):`<div class="empty">No tickets</div>`}</div>`}).join("")}</div>
  <div class="klbl">Sold out tonight · tap to switch off on the ordering site</div>
  <div class="eighty6">${[...BURGERS,...FRIES].map(i=>`<button data-86="${i.id}" class="${soldOut.has(i.id)?"out":""}">${esc(i.nm)}</button>`).join("")}</div>
  ${done.length?`<div class="done-list">Picked up: ${done.map(o=>"#"+o.num).join(", ")}</div>`:""}`;
  const n=live.filter(o=>o.status==="new").length,bd=$("#kBadge");bd.textContent=n;bd.classList.toggle("hidden",!n);
}

/* ---------- test orders ---------- */
const NAMES=["Jurgen","Shaline","Ricardo","Naomi","Gino","Kenrick","Maritza","Dwayne","Yaniska","Edsel","Rignald","Chanella"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function sim(ago=0){
  const items=[],n=1+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){const r=Math.random();
    if(r<.65){const b=rnd(BURGERS),adds=Math.random()<.4?[rnd(ADDONS)]:[];
      items.push({nm:b.nm,detail:adds.map(a=>"+ "+a.nm).join(", "),qty:Math.random()<.25?2:1,price:b.price+adds.reduce((x,a)=>x+a.price,0),note:Math.random()<.2?rnd(["No pickles","Sauce on the side","Well done"]):""})}
    else if(r<.85){const fr=rnd(FRIES);items.push({nm:fr.nm,detail:"",qty:1,price:fr.price,note:""})}
    else{const d=rnd(DRINKS);items.push({nm:d.nm,detail:"",qty:Math.random()<.4?2:1,price:d.price,note:""})}}
  const o={id:Date.now()+Math.random(),num:++seq,name:rnd(NAMES),phone:"+599 9 "+(5100000+Math.floor(Math.random()*899999)).toString().replace(/(\d{3})(\d{4})/,"$1 $2"),
    items,total:items.reduce((a,b)=>a+b.qty*b.price,0),pay:Math.random()<.6?"cash":"sentoo",status:"new",created:Date.now()-ago*60000,when:"asap"};
  orders.push(o);return o;
}
sim(22).status="ready";sim(14).status="grill";sim(9).status="grill";sim(4);sim(1);

/* ---------- events ---------- */
function closeLayer(){$("#layer").innerHTML=""}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
function setView(v){view=v;$("#customer").classList.toggle("hidden",v!=="cust");$("#kitchen").classList.toggle("hidden",v!=="kit");
  $("#vCust").classList.toggle("on",v==="cust");$("#vKit").classList.toggle("on",v==="kit");try{scrollTo(0,0)}catch(e){}}
$("#vCust").onclick=()=>{setView("cust");renderCustomer()};
$("#vKit").onclick=()=>{setView("kit");renderKitchen()};
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let b;
  if(e.target.matches("[data-close]")||g("[data-closebtn]"))return closeLayer();
  if(b=g("[data-lang]")){lang=b.dataset.lang;return renderCustomer()}
  if(b=g("[data-tab]")){tab=b.dataset.tab;return renderCustomer()}
  if(b=g("[data-open]"))return openItem(b.dataset.open);
  if(g("#openCart"))return openCart();
  if(g("#again")){myOrder=null;return renderCustomer()}
  if(b=g("[data-bump]")){const o=orders.find(x=>String(x.id)===b.dataset.bump);o.status={new:"grill",grill:"ready",ready:"done"}[o.status];
    renderKitchen();if(o.id===myOrder)renderCustomer();if(o.status==="ready")toast(`#${o.num} ready · WhatsApp sent to ${o.name}`);return}
  if(b=g("[data-86]")){const id=b.dataset["86"];soldOut.has(id)?soldOut.delete(id):soldOut.add(id);renderKitchen();return renderCustomer()}
  if(g("#sim")){const o=sim();renderKitchen();return toast(`New order #${o.num}`)}
});
setInterval(()=>{if(view==="kit")renderKitchen()},30000);
renderCustomer();renderKitchen();
</script>
</body>
</html>
